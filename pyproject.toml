[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "itemwise"
version = "0.2.0"
description = "Find the eval cases that actually tell you something. Item analysis for LLM evaluation suites."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Jude Oba" }]
keywords = ["llm", "evaluation", "evals", "psychometrics", "item-analysis", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/JudeDesigns/itemwise"
Issues = "https://github.com/JudeDesigns/itemwise/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/itemwise"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
